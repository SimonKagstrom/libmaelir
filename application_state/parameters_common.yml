# This is the list of all possible parameters (common)
cpp_includes:
  - "brightness_mode.hh"
  - "gps_data.hh"

parameters:
  wifi_connected:
    type: bool

  bluetooth_connected:
    type: bool

  gps_status:
    type: enum GpsStatus

  demo_mode:
    type: bool

  position:
    type: struct GpsData

  ota_update_active:
    type: bool
    default: false

  # Seconds since the epoch
  clock:
    type: uint32_t

  # Timezone offset from UTC in minutes
  timezone:
    type: int16_t

  # The display brightness, see BrightnessController
  brightness_mode:
    type: enum BrightnessMode

# This is the list of all possible parameters (common)
cpp_includes:
  - "brightness_mode.hh"
  - "gps_data.hh"

parameters:
  wifi_connected:
    type: bool

  bluetooth_connected:
    type: bool

  gps_status:
    type: enum GpsStatus

  demo_mode:
    type: bool

  position:
    type: struct GpsData

  ota_update_active:
    type: bool

  # Seconds since the epoch
  clock:
    type: uint32_t

  # UTC from the last GPS fix, in seconds since the epoch, or 0 if there hasn't been one.
  gps_utc:
    type: uint32_t

  # Timezone offset from UTC in minutes
  timezone:
    type: int16_t

  # Settings. The application can add its own to the group
  configuration:
    # The display brightness, see BrightnessController
    brightness_mode:
      type: enum BrightnessMode
